<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      background-color: #000;
    }

    /* Contenedor del video */
    #intro-section {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      cursor: pointer;
    }

    #bgVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: fixed;
      z-index: 10;
    }

    /* Capa de texto "Toca la pantalla" */
    #click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      padding: 20px;
      z-index: 101;
    }

    /* --- CONTENIDO PRINCIPAL DE LA INVITACIÓN (Página 2) --- */
    #main-content {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 5;
      overflow: hidden;
    }

    .image-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Contenedor de los 4 botones flotando ENCIMA de la imagen */
    .buttons-overlay {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }

    /* Estilo de cada grupo (botón + texto) */
    .btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Estilo de botones circulares con imagen dentro */
    .btn-circle {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      background-color: #8b5a2b;
      transition: transform 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-circle img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      display: block;
    }

    .btn-item:hover .btn-circle {
      transform: scale(1.1);
    }

    /* Frase debajo de cada botón */
    .btn-text {
      margin-top: 4px;
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 70px;
    }

    /* --- VENTANAS EMERGENTES (MODALES) PARA VESTIMENTA Y REGALOS --- */
    .modal {
      display: none; /* Ocultas por defecto */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      position: relative;
      background-color: #f0ddbe;
      padding: 45px 25px 25px 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      border: 2px solid #8b5a2b;
    }

    /* Botón de la cruz para cerrar en la parte superior */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.8rem;
      color: #333;
      cursor: pointer;
      font-weight: bold;
      background: none;
      border: none;
    }

    .close-btn:hover {
      color: #8b5a2b;
    }

    .modal-content h3 {
      margin-bottom: 15px;
      color: #333;
      font-size: 1.4rem;
    }

    .modal-content p {
      color: #444;
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Sección del Video e Instrucción -->
  <div id="intro-section">
    <div id="click-overlay"></div>
    
    <video
      id="bgVideo"
      playsinline
      preload="auto"
      poster="fotoinicio.png"
    >
      <source src="cenicienta.mp4" type="video/mp4">
      Tu navegador no soporta videos en HTML5.
    </video>
  </div>
  
  <!-- Contenido Principal de la Invitación (Página 2) -->
  <div id="main-content">
    <div class="image-container">
      <img src="emma.png" alt="Imagen de invitación">
      
      <div class="buttons-overlay">
        
        <!-- Botón 1: WhatsApp -->
        <a href="https://wa.me/541132588434" target="_blank" class="btn-item">
          <div class="btn-circle">
            <img src="contacto3.png" alt="WhatsApp">
          </div>
          <span class="btn-text">WhatsApp</span>
        </a>

        <!-- Botón 2: Ubicación (Google Maps) -->
        <a href="https://maps.app.goo.gl/69fnjcySrALdhBeSA" target="_blank" class="btn-item">
          <div class="btn-circle">
            <img src="ub.png" alt="Ubicación">
          </div>
          <span class="btn-text">Ubicación</span>
        </a>
        
        <!-- Botón 3: Vestimenta (Abre modal de vestimenta) -->
        <button id="btn-vestimenta" class="btn-item">
          <div class="btn-circle">
            <img src="vestimenta.png" alt="Vestimenta">
          </div>
          <span class="btn-text">Vestimenta</span>
        </button>
        
        <!-- Botón 4: Regalos (Abre modal de regalos) -->
        <button id="btn-regalos" class="btn-item">
          <div class="btn-circle">
            <img src="regalo.png" alt="Regalos">
          </div>
          <span class="btn-text">Regalos</span>
        </button>

      </div>
    </div>
  </div>

  <!-- Ventana Modal de Vestimenta (Botón 3) -->
  <div id="modal-vestimenta" class="modal">
    <div class="modal-content">
      <button class="close-btn" id="close-vestimenta">&times;</button>
      <h3>Código de Vestimenta</h3>
      <p>Formal / Elegante. Sugerencia: Vestimenta acorde a la ocasión especial.</p>
    </div>
  </div>

  <!-- Ventana Modal de Regalos (Botón 4) -->
  <div id="modal-regalos" class="modal">
    <div class="modal-content">
      <button class="close-btn" id="close-regalos">&times;</button>
      <h3>Ideas de Regalos</h3>
      <p>El mejor regalo es tu presencia. Si deseas tener un detalle con nosotros, puedes consultar las opciones disponibles.</p>
    </div>
  </div>

  <script>
    const introSection = document.getElementById('intro-section');
    const video = document.getElementById('bgVideo');
    const overlay = document.getElementById('click-overlay');
    const mainContent = document.getElementById('main-content');

    // Elementos modales
    const btnVestimenta = document.getElementById('btn-vestimenta');
    const modalVestimenta = document.getElementById('modal-vestimenta');
    const closeVestimenta = document.getElementById('close-vestimenta');

    const btnRegalos = document.getElementById('btn-regalos');
    const modalRegalos = document.getElementById('modal-regalos');
    const closeRegalos = document.getElementById('close-regalos');

    let yaInicio = false;

    // Al hacer clic en cualquier parte de la pantalla inicia el video
    introSection.addEventListener('click', function() {
      if (!yaInicio) {
        yaInicio = true;
        overlay.style.display = 'none';
        video.play().catch(error => {
          console.log("Error al reproducir el video:", error);
        });
      }
    });

    // Cuando el video termina, muestra la invitación (Página 2)
    video.addEventListener('ended', function() {
      introSection.style.display = 'none';
      mainContent.style.display = 'block';
    });

    // Control para abrir y cerrar el modal de Vestimenta
    btnVestimenta.addEventListener('click', function() {
      modalVestimenta.style.display = 'flex';
    });
    closeVestimenta.addEventListener('click', function() {
      modalVestimenta.style.display = 'none';
    });

    // Control para abrir y cerrar el modal de Regalos
    btnRegalos.addEventListener('click', function() {
      modalRegalos.style.display = 'flex';
    });
    closeRegalos.addEventListener('click', function() {
      modalRegalos.style.display = 'none';
    });

    // Cerrar modales si se hace clic fuera de la caja de texto
    window.addEventListener('click', function(event) {
      if (event.target === modalVestimenta) {
        modalVestimenta.style.display = 'none';
      }
      if (event.target === modalRegalos) {
        modalRegalos.style.display = 'none';
      }
    });
  </script>

</body>
</html>
